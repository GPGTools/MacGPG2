readline:
  stage: build
  script:
    - ./create_gpg "readline"
npth:
  stage: build
  script:
    - ./create_gpg "npth"
gettext:
  stage: build
  script:
    - ./create_gpg "gettext"
gmp:
  stage: build
  script:
    - ./create_gpg "gmp"
nettle:
  stage: build
  script:
    - ./create_gpg "nettle"
libtasn1:
  stage: build
  script:
    - ./create_gpg "libtasn1"
gnutls:
  stage: build
  script:
    - ./create_gpg "gnutls"
libgpg-error:
  stage: build
  script:
    - ./create_gpg "libgpg-error"
libgcrypt:
  stage: build
