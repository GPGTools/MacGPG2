stages:
  - build
  - test
  - packaging
  - deploy

readline:
  stage: build
  script:
    - find $CI_PROJECT_DIR
    - ./create_gpg.sh "readline"
  artifacts:
    untracked: true
    paths:
      - build/
    expire_in: 1 month
npth:
  stage: build
  script:
    - find $CI_PROJECT_DIR
    - ./create_gpg.sh "npth"
  artifacts:
    untracked: true
    paths:
      - build/
    expire_in: 1 month
