readline:
  stage: build
  script:
    - ./create_gpg.sh "readline"
npth:
  stage: build
  script:
    - ./create_gpg.sh "npth"
gettext:
  stage: build
  script:
    - ./create_gpg.sh "gettext"
gmp:
  stage: build
  script:
    - ./create_gpg.sh "gmp"
nettle:
  stage: build
  script:
    - ./create_gpg.sh "nettle"
libtasn1:
  stage: build
  script:
    - ./create_gpg.sh "libtasn1"
gnutls:
  stage: build
  script:
