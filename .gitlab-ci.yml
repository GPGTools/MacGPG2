stages:
  - build
  - test
  - packaging
  - deploy

cache:
    paths:
      - build/
.keep-build:
  artifacts:
    untracked: true
    paths:
      - build/
    expire_in: 1 month

readline:
  extends: .keep-build
  stage: build
  script:
    - ./create_gpg.sh "readline"
  
npth:
  extends: .keep-build
  stage: build
  script:
    - ./create_gpg.sh "npth"

gettext:
  extends: .keep-build
  stage: build
  script:
    - ./create_gpg.sh "gettext"
gmp:
  extends: .keep-build
  stage: build
  script:
    - ./create_gpg.sh "gmp"
nettle:
  extends: .keep-build
  stage: build
  script:
    - ./create_gpg.sh "nettle"
libtasn1:
  extends: .keep-build
  stage: build
  script:
    - ./create_gpg.sh "libtasn1"
gnutls:
  extends: .keep-build
  stage: build
  script:
    - ./create_gpg.sh "gnutls"
libgpg-error:
  extends: .keep-build
  stage: build
  script:
    - ./create_gpg.sh "libgpg-error"
libgcrypt:
  extends: .keep-build
  stage: build
  needs: [libgpg-error]
  script:
    - ./create_gpg.sh "libgcrypt"
libassuan:
  extends: .keep-build
  stage: build
  script:
    - ./create_gpg.sh "libassuan"
libksba:
  extends: .keep-build
  stage: build
  script:
    - ./create_gpg.sh "libksba"
sqlite:
  extends: .keep-build
  stage: build
  script:
    - ./create_gpg.sh "sqlite"
libusb:
  extends: .keep-build
  stage: build
  script:
    - ./create_gpg.sh "libusb"
gnupg:
  extends: .keep-build
  stage: build
  script:
    - ./create_gpg.sh "gnupg"

test-job1:
  stage: test
  script:
    - echo "This job tests something"

test-job2:
  stage: test
  script:
    - echo "This job tests something, but takes more time than test-job1."
    - echo "After the echo commands complete, it runs the sleep command for 20 seconds"
    - echo "which simulates a test that runs 20 seconds longer than test-job1"
    - sleep 20

prepare-for-packaging:
  stage: packaging
  script:
    - ./create_gpg.sh "prepare-for-packaging"
  artifacts:
    paths:
      - build
    expire_in: 1 month

deploy-prod:
  stage: deploy
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
    - find build
  environment: production
  artifacts:
    paths:
      - build